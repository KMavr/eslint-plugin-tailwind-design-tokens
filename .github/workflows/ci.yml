name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
        eslint: ['10']
        include:
          - node: '24'
            eslint: '9'
          - node: '24'
            eslint: '8'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install ESLint ${{ matrix.eslint }}
        if: matrix.eslint != '10'
        run: npm install --no-save eslint@${{ matrix.eslint }}
      - run: npm run lint
        if: matrix.eslint == '10'
      - run: npm run typecheck
        if: matrix.eslint == '10'
      - run: npm test -- --run
