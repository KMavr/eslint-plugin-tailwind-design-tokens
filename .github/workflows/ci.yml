name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, typecheck, tests (Node ${{ matrix.node }}, ESLint ${{ matrix.eslint }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        eslint: ['10']
        include:
          - node: '26'
            eslint: '9'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install ESLint ${{ matrix.eslint }}
        if: matrix.eslint != '10'
        run: npm install --no-save eslint@${{ matrix.eslint }}
      - name: Lint
        run: npm run lint
        if: matrix.eslint == '10'
      - name: Check formatting
        run: npm run format:check
        if: matrix.eslint == '10'
      - name: Typecheck
        run: npm run typecheck
        if: matrix.eslint == '10'
      - name: Check generated docs
        run: npm run doc:check
        if: matrix.eslint == '10'
      - name: Run tests
        run: npm test -- --run
        if: matrix.eslint != '10' || matrix.node != '26'
      - name: Run tests with coverage
        run: npm run test:coverage
        if: matrix.eslint == '10' && matrix.node == '26'

  # Single required check, so matrix changes don't orphan branch protection.
  ci-success:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
